name: Verify disposable service observation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/service-recipe.yml'
      - 'torture/verify_service_recipe.ps1'
      - 'torture/exe/DisposableService.cs'
      - 'docs/service-observation.md'
      - 'src/process_runner.py'
      - 'src/session.py'
      - 'src/leak_detector.py'
      - 'src/main.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    name: Observe a disposable LocalService
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify safe service observation and ordinary detach
        shell: pwsh
        run: ./torture/verify_service_recipe.ps1 -ResultPath '${{ runner.temp }}/service-recipe-result.json'
      - name: Retain synthetic result summary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: disposable-service-result-${{ github.run_id }}
          path: '${{ runner.temp }}/service-recipe-result.json'
          if-no-files-found: error
          retention-days: 3

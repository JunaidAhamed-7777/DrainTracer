name: Build and publish to PyPI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag matching DashboardApp.VERSION (for example v5.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    name: Verify Linux (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimum supported runtime dependencies
        if: matrix.python == '3.10'
        run: python -m pip install psutil==5.9.0 rich==13.7.0 tomli==1.1.0
      - name: Install application and build tools
        run: python -m pip install . build
      - name: Verify runtime snapshot
        run: python .github/run_check.py snapshot python -m unittest discover -s tests -p test_installation.py
      - name: Compile source
        run: python .github/run_check.py compilation python -m compileall -q src
      - name: Validate report JavaScript
        run: python .github/run_check.py javascript node --check leak_reports/frames/report.js
      - name: Run regression tests
        run: python .github/run_check.py regression python -m unittest discover -s tests
      - name: Run bounded Linux workloads
        run: python .github/run_check.py workloads python torture/verify_suite.py
      - name: Build distributions
        run: python -m build
      - name: Verify wheel in a clean environment
        run: python tests/verify_distribution.py dist/*.whl
      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: failure-linux-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/draintracer-checks/*.log
          if-no-files-found: warn
          retention-days: 3

  build:
    name: Verify and build on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install minimum supported runtime dependencies
        run: python -m pip install psutil==5.9.0 rich==13.7.0 tomli==1.1.0
      - name: Install application and build tools
        run: python -m pip install . build twine
      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          @'
          import os
          import re
          import subprocess
          from src.dashboard import DashboardApp

          tag = os.environ['RELEASE_TAG']
          if tag:
              assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Use a full Semantic Versioning tag'
              assert tag == DashboardApp.VERSION, f'{tag} does not match {DashboardApp.VERSION}'
              tagged = subprocess.check_output(
                  ['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True
              ).strip()
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              assert tagged == head, 'The build must use the tagged commit'
          print(f'Building DrainTracer {DashboardApp.VERSION}')
          '@ | python
      - name: Verify runtime snapshot
        run: python .github/run_check.py snapshot python -m unittest discover -s tests -p test_installation.py
      - name: Compile source
        run: python .github/run_check.py compilation python -m compileall -q src
      - name: Validate report JavaScript
        run: python .github/run_check.py javascript node --check leak_reports/frames/report.js
      - name: Run regression tests
        run: python .github/run_check.py regression python -m unittest discover -s tests
      - name: Run bounded Windows workloads
        run: python .github/run_check.py workloads python torture/verify_suite.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Verify wheel in a clean environment
        run: python tests/verify_distribution.py (Get-ChildItem dist/*.whl).FullName
      - name: Upload verified distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: failure-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/draintracer-checks/*.log
          if-no-files-found: warn
          retention-days: 3

  windows-current:
    name: Verify Windows current (Python 3.14, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install current dependencies and build tools
        run: python -m pip install . build
      - name: Verify runtime snapshot
        run: python .github/run_check.py snapshot python -m unittest discover -s tests -p test_installation.py
      - name: Compile source
        run: python .github/run_check.py compilation python -m compileall -q src
      - name: Validate report JavaScript
        run: python .github/run_check.py javascript node --check leak_reports/frames/report.js
      - name: Run regression tests
        run: python .github/run_check.py regression python -m unittest discover -s tests
      - name: Run bounded Windows workloads
        run: python .github/run_check.py workloads python torture/verify_suite.py
      - name: Build distributions
        run: python -m build
      - name: Verify wheel in a clean environment
        shell: pwsh
        run: python tests/verify_distribution.py (Get-ChildItem dist/*.whl).FullName
      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: failure-${{ matrix.os }}-current-${{ github.run_id }}
          path: ${{ runner.temp }}/draintracer-checks/*.log
          if-no-files-found: warn
          retention-days: 3

  publish:
    name: Publish verified distributions
    needs: [build, linux, windows-current]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/draintracer/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

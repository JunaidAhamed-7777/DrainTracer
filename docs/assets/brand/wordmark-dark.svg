    <path d="M24 54v40m208-40v40" fill="none" stroke="#73DACA" stroke-width="6"/>
    <g fill="#3D9D97" stroke="#73DACA" stroke-width="4" stroke-linejoin="round">
      <rect x="42" y="46" width="16" height="56" rx="2"/>

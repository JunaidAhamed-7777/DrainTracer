  <title id="title">DrainTracer social preview</title>
  <desc id="desc">DrainTracer. See what keeps growing. Open source Windows process resource monitor for memory, handles, and threads. A straight industrial pipe leaks blue liquid through a visible central crack into a tracing reticle.</desc>
